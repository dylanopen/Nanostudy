<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background 
  <rect width="400" height="400" fill="#F6F5EF" /> -->

  <!-- Icon Outline / Path Structure -->
  <g stroke="#0E3B2E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Outer Vertical Stem -->
    <path d="M 70,70 L 70,330" />

    <!-- Inner-Left Triangle Structure -->
    <path d="M 70,210 L 130,260 L 70,330" />

    <!-- Left Diagonal of N -->
    <path d="M 130,260 L 200,190" />

    <!-- Right Diagonal of N -->
    <path d="M 200,190 L 330,330" />

    <!-- Mint Stem (Vertical) -->
    <path d="M 270,190 L 270,265" />

    <!-- Right Outer Vertical Stem -->
    <path d="M 330,70 L 330,330" />

    <!-- Book Left Page - Upper Rim -->
    <path d="M 70,70 Q 125,150 200,190" />

    <!-- Book Left Page - Lower Rim -->
    <path d="M 70,70 Q 140,175 200,190" />

    <!-- Book Right Page - Upper Rim -->
    <path d="M 330,70 Q 275,150 200,190" />

    <!-- Book Right Page - Lower Rim -->
    <path d="M 330,70 Q 260,175 200,190" />
  </g>

  <!-- Network Nodes (Circles) -->
  <!-- Top-Left Node -->
  <circle cx="70" cy="70" r="14" fill="#0E3B2E" />

  <!-- Middle-Left Node -->
  <circle cx="70" cy="210" r="14" fill="#0E3B2E" />

  <!-- Bottom-Left Node -->
  <circle cx="70" cy="330" r="14" fill="#0E3B2E" />

  <!-- Inner-Left Node -->
  <circle cx="130" cy="260" r="14" fill="#0E3B2E" />

  <!-- Center Spine Node -->
  <circle cx="200" cy="190" r="14" fill="#0E3B2E" />

  <!-- Top-Right Node -->
  <circle cx="330" cy="70" r="14" fill="#0E3B2E" />

  <!-- Bottom-Right Node -->
  <circle cx="330" cy="330" r="14" fill="#0E3B2E" />

  <!-- Mint Accent Node -->
  <circle cx="270" cy="190" r="16" fill="#70E0A6" />
</svg>

